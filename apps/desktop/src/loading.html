<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MYTHOS 正在启动</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0d1624; color: #dce7f2; }
      main { width: min(560px, 72vw); }
      .eyebrow { color: #7f98ad; font: 600 11px/1.4 ui-monospace, SFMono-Regular, monospace; letter-spacing: .18em; }
      h1 { margin: 14px 0 34px; font: 650 36px/1 "Avenir Next Condensed", sans-serif; letter-spacing: .14em; }
      .trace { position: relative; display: grid; gap: 18px; padding-left: 25px; }
      .trace::before { content: ""; position: absolute; left: 6px; top: 7px; bottom: 7px; width: 1px; background: #2c4256; }
      .step { position: relative; color: #7f98ad; font-size: 13px; }
      .step::before { content: ""; position: absolute; left: -23px; top: 4px; width: 7px; height: 7px; border-radius: 50%; background: #4e6579; box-shadow: 0 0 0 4px #0d1624; }
      .step.active { color: #dce7f2; }
      .step.active::before { background: #86aeca; animation: pulse 1.3s ease-in-out infinite; }
      @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(134,174,202,.08); } }
      @media (prefers-reduced-motion: reduce) { .step.active::before { animation: none; } }
    </style>
  </head>
  <body><main><div class="eyebrow">MYTHOS / DESKTOP BETA</div><h1>正在准备工作台</h1><div class="trace"><div class="step active">准备本地工作区</div><div class="step">连接智能服务</div><div class="step">恢复项目与会话</div></div></main></body>
</html>
