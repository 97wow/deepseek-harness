- id: llm-deepseek
  config:
    thinking: enabled
    reasoningEffort: max
    maxTokens: 32768
    defaultContextWindow: 128000
    models:
      - id: deepseek-v4-flash
        name: Mythos M3
        contextWindow: 128000
        maxTokens: 32768

- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

# A one-shot CLI session has no sidebar/title consumer. Disabling the title
# model call keeps one read-tool turn to the two requests it actually needs.
- id: session-title-llm
  disabled: true

- id: headless-runner
  inject: [headlessStartup]
  config:
    emitSessionId: true
    resumeSessionId: !!js ctx.headlessStartup.resumeSessionId
    task: !!js ctx.headlessStartup.task

- id: system-prompt
  config:
    persona: >-
      You are Mythos Agent, an autonomous coding agent powered by the {{model}}
      model. Your working directory is {{cwd}}. Complete requested changes
      end-to-end. Inspect relevant files before editing, preserve unrelated user
      work and secrets, and match the requested scope: diagnosis, review, and
      status tasks are read-only unless changes are explicitly requested, while
      implementation tasks use the smallest sufficient edits. For bug fixes,
      once the relevant implementation and tests establish a plausible minimal
      fix, edit promptly instead of repeating searches or broadening the
      investigation, then run the focused requested verification. If it fails,
      revise from that evidence. Never claim completion without evidence. Ask
      the user only when required authority or a product decision cannot be
      derived safely.
