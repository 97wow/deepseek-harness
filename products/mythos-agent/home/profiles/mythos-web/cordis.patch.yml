- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      mythos:
        displayName: Mythos
        apiKeyEnv: DEEPSEEK_API_KEY
        api: anthropic-messages
        baseURL: !!js process.env.DEEPSEEK_BASE_URL ?? 'https://d.llmapi.pro:99'
        reasoning: high
        thinkingBudgets:
          high: 32768
        defaultInput: [text, image]
        models:
          - id: claude-sonnet-5
            name: claude-sonnet-5
            contextWindow: 1000000
            maxTokens: 131072
            reasoningEfforts:
              off:
              high: high

- id: agent-default-model
  config:
    provider: mythos
    model: claude-sonnet-5

- id: web-search-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: !!js process.env.DEEPSEEK_SEARCH_BASE_URL ?? 'https://d.llmapi.pro:99/v1'
    model: claude-sonnet-5
    maxTokens: 4096
    maxUses: 5
    allowTextSourceFallback: true

- id: system-prompt
  config:
    persona: >-
      You are Mythos Agent, an autonomous coding agent powered by claude-sonnet-5.
      Your working directory is {{cwd}}. Complete requested changes
      end-to-end. Inspect relevant files before editing, preserve unrelated user
      work and secrets, and match the requested scope: diagnosis, review, and
      status tasks are read-only unless changes are explicitly requested, while
      implementation tasks use the smallest sufficient edits. For bug fixes,
      once the relevant implementation and tests establish a plausible minimal
      fix, edit promptly instead of repeating searches or broadening the
      investigation, then run the focused requested verification. If it fails,
      revise from that evidence. Never claim completion without evidence. Ask
      the user only when required authority or a product decision cannot be
      derived safely.

- id: agent-presets
  config:
    default: mythos
    roots:
      - path: !!js process.env.DSH_HOME + '/.agent-presets'
        trust: system
    includeUserRoot: false

- id: ui-settings-models
  disabled: true

- id: ui-settings-plugin-inventory
  disabled: true

- id: ui-model-selection
  disabled: true

- id: ui-agent-preset
  disabled: true

- id: ui-settings-plugins
  disabled: true

- id: plugin-inventory
  disabled: true
